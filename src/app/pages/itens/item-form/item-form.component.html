<div class="item-form-container">
  <div class="card">
    <h1>Cadastrar Item para Doação</h1>
    
    @if (errorMessage) {
      <div class="alert alert-error">{{ errorMessage }}</div>
    }

    @if (successMessage) {
      <div class="alert alert-success">{{ successMessage }}</div>
    }

    @if (!authService.isDoador()) {
      <div class="alert alert-error">
        Apenas doadores podem cadastrar itens. <a routerLink="/register">Registre-se como doador</a>
      </div>
    } @else {
      <form (ngSubmit)="onSubmit()" #itemForm="ngForm">
        <div class="form-group">
          <label for="nome">Nome do Item *</label>
          <input
            type="text"
            id="nome"
            name="nome"
            [(ngModel)]="itemData.nome"
            required
            [disabled]="loading"
            placeholder="Ex: Cesta Básica, Roupas Infantis, etc."
          />
        </div>

        <div class="form-group">
          <label for="descricao">Descrição *</label>
          <textarea
            id="descricao"
            name="descricao"
            [(ngModel)]="itemData.descricao"
            required
            rows="4"
            [disabled]="loading"
            placeholder="Descreva o item em detalhes..."
          ></textarea>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="tipo">Tipo de Item *</label>
            <select
              id="tipo"
              name="tipo"
              [(ngModel)]="itemData.tipo"
              required
              [disabled]="loading"
            >
              @for (option of tipoItemOptions; track option.value) {
                <option [value]="option.value">{{ option.label }}</option>
              }
            </select>
          </div>

          <div class="form-group">
            <label for="quantidade">Quantidade *</label>
            <input
              type="number"
              id="quantidade"
              name="quantidade"
              [(ngModel)]="itemData.quantidade"
              required
              min="1"
              [disabled]="loading"
            />
          </div>
        </div>

        <div class="form-group">
          <label for="estadoConservacao">Estado de Conservação *</label>
          <select
            id="estadoConservacao"
            name="estadoConservacao"
            [(ngModel)]="itemData.estadoConservacao"
            required
            [disabled]="loading"
          >
            @for (option of estadoConservacaoOptions; track option.value) {
              <option [value]="option.value">{{ option.label }}</option>
            }
          </select>
        </div>

        <div class="form-group">
          <label for="foto">URL da Foto (Opcional)</label>
          <input
            type="url"
            id="foto"
            name="foto"
            [(ngModel)]="itemData.foto"
            [disabled]="loading"
            placeholder="https://exemplo.com/foto.jpg"
          />
        </div>

        <div class="form-actions">
          <button
            type="button"
            class="btn-secondary"
            (click)="cancel()"
            [disabled]="loading"
          >
            Cancelar
          </button>
          <button
            type="submit"
            class="btn-primary"
            [disabled]="loading || !itemForm.valid"
          >
            {{ loading ? 'Cadastrando...' : 'Cadastrar Item' }}
          </button>
        </div>
      </form>
    }
  </div>
</div>
