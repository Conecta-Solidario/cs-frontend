<div class="login-container">
  <div class="card login-card">
    <h1>Login</h1>
    
    @if (errorMessage) {
      <div class="alert alert-error">{{ errorMessage }}</div>
    }

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="loginData.email"
          required
          [disabled]="loading"
        />
      </div>

      <div class="form-group">
        <label for="senha">Senha</label>
        <input
          type="password"
          id="senha"
          name="senha"
          [(ngModel)]="loginData.senha"
          required
          [disabled]="loading"
        />
      </div>

      <button
        type="submit"
        class="btn-primary"
        [disabled]="loading || !loginForm.valid"
      >
        {{ loading ? 'Entrando...' : 'Entrar' }}
      </button>
    </form>

    <div class="register-link">
      <p>Não tem uma conta? <a routerLink="/register">Registre-se aqui</a></p>
    </div>

    <div class="demo-accounts">
      <h3>Contas de Demonstração:</h3>
      <div class="demo-account">
        <strong>Doador:</strong> joao&#64;example.com / 123456
      </div>
      <div class="demo-account">
        <strong>Receptor:</strong> maria&#64;example.com / 123456
      </div>
    </div>
  </div>
</div>
